<div class="container mt-5">

    <h3 class="mb-4 text-center">Assigned Treks</h3>

    <div class="row">

        {% for trek in treks %}
        <div class="col-md-6 mb-4">
            <div class="card shadow h-100">
                <div class="card-body">
                    <h5 class="card-title">{{ trek.trek_name }}</h5>
                    <p><strong>location</strong> {{ trek.location if trek.location else "N/A" }}</p>
                    <p><strong>Difficulty</strong> {{ trek.difficulty }}</p>
                    <p><strong>Duration</strong>{{ trek.duration if trek.duration else 'Not set' }} days</p>
                    <a href="{{ url_for('view_trek', trek_id=trek.trek_id) }}" class="btn btn-primary">
                    View Trek Details
                </a>
            </div>
            </div>
            </div>
        {%endfor%}
