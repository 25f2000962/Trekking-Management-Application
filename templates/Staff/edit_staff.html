<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    
    <a class="navbar-brand fw-bold">TrekVista</a>

    <div class="ms-auto">
        <a href="{{ url_for('user_dashboard') }}" class="btn text-white">
            Back
        </a>
    </div>

</nav>
    <div class="container-fluid d-flex justify-content-center align-items-center"
    style="
    height:639px;
    background-image:url('/static/images/login_bg.webp');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
">
     
<div class="container mt-5">

    <div class="card shadow p-5 mx-auto" style="max-width: 400px;">

        
       
            <h2 class="text-center">Edit Profile</h2>
            <br>

            

            <form method="POST">

                <div class="form-floating mb-3">
                    <input
                        type="text"
                        name="staff_name"
                        class="form-control"
                        value="{{ staff.staff_name }}"
                        required>

                    <label>Full Name</label>
                </div>

                <div class="form-floating mb-3">
                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ staff.email }}"
                        required>

                    <label>Email</label>
                </div>

                <div class="form-floating mb-4">
                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        value="{{ staff.contact_details }}"
                        required>

                    <label>Phone Number</label>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Update Profile
                </button>

            </form>

    </div>

</div>


</body>
</html>
