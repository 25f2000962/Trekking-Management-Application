<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Trek</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    


<nav class="navbar bg-dark  navbar-expand-lg">
    <div class="container-fluid">

        <a class="navbar-brand text-white">TrekVista</a>
        <div ms-auto>
        <a class="btn btn-outline-light ms-3" href="/admin_dashboard">Dashboard</a>

        <!-- LOGOUT -->
        <a href="/" class="btn btn-outline-light ms-3">Logout</a>
            </div>
    </div>
</nav>

<!-- Form -->
 <div class="container-fluid d-flex justify-content-center align-items-center"
    style="
    height: calc(100vh - 56px);
    background-image:url('/static/images/WhatsApp\ Image\ 2026-06-07\ at\ 3.29.17\ PM.jpeg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
">
<div class="d-flex justify-content-center">
    <div class="card " style="width:30rem">
        <div class="card-body">

            <h5 class="card-title text-center">Create Guide</h5>
            <form method="POST" action="/admin/staff/create_staff">

                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" name="staff_name" class="form-control" placeholder="Enter guide's name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contact Details</label>
                    <input name="contact_details" class="form-control" rows="3" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">email</label>
                    <input type="text" name="email" class="form-control" required>
                </div>


                <div class="mb-3">
                    <label class="form-label">password</label>
                    <input type="password" name="password" class="form-control">
                </div>
                

                

                <button type="submit" class="btn btn-primary w-100">Create Staff</button>

            </form>

        </div>
    </div>
</div>
</div>
</body>
</html>
