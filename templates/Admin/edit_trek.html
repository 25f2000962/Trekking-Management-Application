<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edut Trek</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
</head>

<body>
    


<nav class="navbar bg-dark  navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand text-white">TrekVista</a>
        <div ms-auto>
        <a class="btn btn-outline-light ms-3" href="/admin/treks">Back</a>


            </div>
    </div>
</nav>

<!-- Form -->
 <div class="container-fluid d-flex justify-content-center align-items-center"
    style="
    height:calc(100vh - 56px);
    background-image:url('/static/images/create_trek.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
">


    <!-- 🔹 FLASH MESSAGES -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
<div class="d-flex justify-content-center">
    <div class="card " style="width:30rem">
        <div class="card-body">

            <h5 class="card-title text-center">Edit Trek</h5>
            
        
            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Trek Name</label>
                    <input type="text" name="trek_name" class="form-control" value="{{ trek.trek_name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">location</label>
                    <input name="location" class="form-control" rows="3"  value="{{ trek.location }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">difficulty</label>
                    <input type="text" name="difficulty" class="form-control" value="{{ trek.difficulty }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">duration</label>
                    <input type="int" name="duration" class="form-control" value="{{ trek.duration }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Available slots</label>
                    <input type="int" name="available_slots" class="form-control" value="{{ trek.available_slots }}">
                </div>
                
                <div>
                    <label class="form-label">Guide</label>
                
                <select name="staff_id" class="form-select">
                     <option value="">Not Assigned</option>

            {% for staff in staff_members %}
                    <option value="{{ staff.staff_id }}">{{ staff.staff_name }}</option>
            {% endfor %}
</select>
              </div>  
                <br>

                <button type="submit" class="btn btn-primary w-100">Done</button>

            </form>

        </div>
    </div>
</div>
</div>
</body>
</html>
