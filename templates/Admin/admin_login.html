<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin login</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    
    <a class="navbar-brand fw-bold">TrekVista</a>

    <div class="ms-auto">
        <a href="{{ url_for('home') }}" class="btn btn-outline-light">
            Back
        </a>
    </div>

</nav>
    <div class="container-fluid d-flex justify-content-center align-items-center"
    style="
    height:100vh;
    background-image:url('/static/images/login_bg.webp');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
">
     
<div class="container mt-5">

    <div class="card shadow p-5 mx-auto" style="max-width: 400px;">

        <h3 class="text-center ">Welcome back,Admin</h3>

        <form method="POST">

            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>


            <button class="btn btn-dark w-100">Login</button>
            
        </form>
            <p class="text-center mt-3">
    don't have an account? 
    <a href="/home" class="text-primary">Home</a>
</p>
            
        </div>

    </div>

</div>


</body>
</html>
