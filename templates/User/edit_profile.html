<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    
    <a class="navbar-brand fw-bold">TrekVista</a>

    <div class="ms-auto">
        <a href="{{ url_for('user_dashboard') }}" class="btn btn-outline-light">
            Back
        </a>
    </div>

</nav>
    <div class="container-fluid d-flex justify-content-center align-items-center"
    style="
    height:100vh;
    background-image:url('/static/images/login_bg.webp');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
">
     
<div class="container mt-5">

    <div class="card shadow p-5 mx-auto" style="max-width: 400px;">

        
        <form method="POST">
            <h2 class = "text-center">Edit Profile</h2>
            <br>
            <hr>
            <br>
            <div class="form-floating mb-3">
                <input type="text" name="user_name" class="form-control" value="{{ user.user_name }}" required>
                <label>Full Name</label>
            </div>

            <div class="form-floating mb-3">
                <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                <label>Email</label>
            </div>

            <div class="form-floating mb-3">
                <input type="text" name="mobile" class="form-control" value="{{ user.mobile }}" required>
                <label>Mobile</label>
            </div>

            <br>
                <button type="submit" class="btn btn-primary w-100">Done</button>
        </form>

    </div>

</div>


</body>
</html>
