<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    
    <a class="navbar-brand fw-bold">TrekVista</a>

    <div class="ms-auto">
        <a href="{{ url_for('home') }}" class="btn btn-outline-light">
            Back
        </a>
    </div>

</nav>
    <div class="container-fluid d-flex justify-content-center align-items-center"
    style="
    height:100vh;
    background-image:url('/static/images/register_bg2.avif');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
">
     
<div class="container mt-5">

    <div class="card shadow p-5 mx-auto" style="max-width: 400px;">

        <h3 class="text-center ">Your Adventure Starts Here</h3>

        <form method="POST">

            
            <div class="form-floating mb-3">
                <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                <label>Full Name</label>
            </div>

            <div class="form-floating mb-3">
                <input type="email" name="email" class="form-control" placeholder="email" required>
                <label>Email</label>
            </div>

            <div class="form-floating mb-3">
                <input type="text" name="phone" class="form-control" placeholder="phone" required>
                <label>Mobile</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" name="password" class="form-control" placeholder="password" required>
                <label>Password</label>
            </div>
                <p class="text-center mt-3">
    Already have an account? 
    <a href="/login" class="text-primary">Login</a>
</p>
            <button class="btn btn-primary w-100 mt-2">Register</button>
            
        </form>
    </div>

</div>


</body>
</html>
